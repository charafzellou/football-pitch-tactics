name: CI

# Runs on every push and PR. Two real blocking gates (typecheck, unit tests +
# coverage) plus a build smoke test; lint runs but does not block merges — see
# the job below for why.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

defaults:
  run:
    working-directory: frontend

jobs:
  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    # This repo's eslint config (prettier-only, no @nuxt/eslint-config rules
    # wired in) currently fails on ~5,900 pre-existing formatting violations
    # across the whole tree — including .nuxt build output and the eslint
    # config file itself — none of which this PR/commit is responsible for.
    # Runs so the signal is visible, but doesn't block merges until that
    # backlog is dealt with on its own. Remove continue-on-error once it is.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # `nuxt prepare` generates .nuxt/tsconfig.*.json — the project references
      # tsconfig.json points at — without needing a full dev server or build.
      - name: Generate Nuxt types
        run: bunx nuxt prepare
      - name: Typecheck server
        run: bunx tsc --noEmit -p .nuxt/tsconfig.server.json
      - name: Typecheck app
        run: bunx tsc --noEmit -p .nuxt/tsconfig.app.json

  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Nuxt types aren't required to run vitest.config.ts (it resolves
      # #shared/#components by hand, see that file's header), but generating
      # them keeps this job's environment consistent with the others and
      # catches any future accidental dependency on Nuxt's auto-imports.
      - name: Generate Nuxt types
        run: bunx nuxt prepare
      # Fails the job if coverage drops below the thresholds in
      # vitest.config.ts, not just if a test fails.
      - name: Run tests with coverage
        run: bun run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    # Catches build-time breakage (SSR bundling, Nitro route generation, an
    # import that resolves in dev but not in a production build) that neither
    # typecheck nor the unit suite would ever exercise — this project has no
    # DB-backed integration or e2e layer yet, see docs/technical/testing.md,
    # so a clean production build is the closest thing to an end-to-end
    # smoke test CI currently has.
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
