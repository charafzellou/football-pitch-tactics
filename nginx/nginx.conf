# Server configuration : football-pitch-tactics.com
server {
    listen 80;
    listen 443 ssl http2;
    server_name football-pitch-tactics.com www.football-pitch-tactics.com;

    # /etc/letsencrypt/live/football-pitch-tactics.com/
    ssl_certificate /etc/letsencrypt/live/football-pitch-tactics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/football-pitch-tactics.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    location / {
        proxy_pass                    http://frontend:8080;
        proxy_set_header              Host                $host;
        proxy_set_header              Upgrade             $http_upgrade;
        proxy_set_header              Connection          'upgrade';
        proxy_set_header              X-Real-IP           $remote_addr;
        proxy_set_header              X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header              X-Forwarded-Proto   $scheme;
        proxy_redirect                off;
        proxy_buffering               on;
        proxy_cache_valid             200 1d;
        proxy_cache_use_stale         error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_read_timeout            1m;
        proxy_connect_timeout         1m;
        proxy_cache_bypass            $http_upgrade;
    }
}

